<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I'm Sorry 💕</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --peach: #f5c6aa;
            --rose: #e8a0bf;
            --cream: #fef9f3;
            --burgundy: #6b1d3a;
            --gold: #c9a96e;
            --soft-pink: #f7d6e0;
            --text: #e8d5c4;
            --muted: #a09080;
            --today-glow: #ff7b89;
            --selected-glow: #c9a96e;
            --heart-color: #e8576b;
        }

.countdown-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
}
.whatsapp-btn {
    display: inline-block;
    padding: 11px 20px;
    background: rgba(37, 211, 102, 0.2);
    border: 1px solid rgba(37, 211, 102, 0.5);
    border-radius: 24px;
    color: #25d366;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.3s;
    letter-spacing: 0.02em;
    font-family: 'Georgia', serif;
    -webkit-tap-highlight-color: transparent;
}
.whatsapp-btn:active {
    transform: scale(0.94);
    background: rgba(37, 211, 102, 0.35);
    box-shadow: 0 0 20px rgba(37, 211, 102, 0.2);
}
.whatsapp-btn i {
    margin-right: 6px;
}

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(232, 160, 191, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 60%, rgba(245, 198, 170, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(107, 29, 58, 0.1) 0%, transparent 40%);
            font-family: 'Georgia', 'Times New Roman', serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            padding-top: 24px;
            color: var(--text);
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* Floating icons container */
        .floating-icons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .floating-icon {
            position: absolute;
            opacity: 0.10;
            animation: floatUp linear infinite;
            color: var(--rose);
            font-size: 1rem;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.12;
            }
            80% {
                opacity: 0.06;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }
        @keyframes floatUpAlt {
            0% {
                transform: translateY(105vh) rotate(0deg) scale(0.4);
                opacity: 0;
            }
            15% {
                opacity: 0.09;
            }
            75% {
                opacity: 0.05;
            }
            100% {
                transform: translateY(-8vh) rotate(-360deg) scale(1.0);
                opacity: 0;
            }
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.18);
            }
        }
        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }
            14% {
                transform: scale(1.25);
            }
            28% {
                transform: scale(1);
            }
            42% {
                transform: scale(1.25);
            }
            56% {
                transform: scale(1);
            }
        }
        @keyframes softGlow {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(255, 123, 137, 0.5), 0 0 20px rgba(255, 123, 137, 0.2);
            }
            50% {
                box-shadow: 0 0 16px rgba(255, 123, 137, 0.75), 0 0 32px rgba(255, 123, 137, 0.3);
            }
        }
        @keyframes selectedGlow {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(201, 169, 110, 0.5), 0 0 22px rgba(201, 169, 110, 0.2);
            }
            50% {
                box-shadow: 0 0 18px rgba(201, 169, 110, 0.75), 0 0 36px rgba(201, 169, 110, 0.3);
            }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes countdownPulse {
            0%,
            100% {
                text-shadow: 0 0 8px rgba(201, 169, 110, 0.4);
            }
            50% {
                text-shadow: 0 0 20px rgba(201, 169, 110, 0.85), 0 0 36px rgba(201, 169, 110, 0.25);
            }
        }
        @keyframes doubleHeartBeat {
            0%,
            100% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.2);
            }
            60% {
                transform: scale(0.95);
            }
        }

        .main-container {
            background: rgba(22, 33, 62, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(232, 160, 191, 0.2);
            border-radius: 28px;
            padding: 32px 24px;
            max-width: 620px;
            width: 100%;
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(232, 160, 191, 0.08) inset;
            animation: fadeInUp 0.8s ease-out;
            margin-bottom: 40px;
        }

        /* Apology Letter */
        .letter-section {
            margin-bottom: 28px;
            position: relative;
        }
        .letter-icon-wrapper {
            text-align: center;
            margin-bottom: 18px;
        }
        .double-hearts {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 50px;
            animation: doubleHeartBeat 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(232, 160, 191, 0.5));
        }
        .double-hearts .heart-1 {
            position: absolute;
            top: 0;
            left: 0;
            font-size: 28px;
            color: var(--rose);
        }
        .double-hearts .heart-2 {
            position: absolute;
            top: 10px;
            left: 14px;
            font-size: 28px;
            color: var(--peach);
        }
        .letter-text {
            background: rgba(0, 0, 0, 0.28);
            border-radius: 20px;
            padding: 28px 22px;
            border-left: 4px solid var(--rose);
            line-height: 1.85;
            font-size: 1.25rem;
            color: var(--text);
            min-height: 120px;
            position: relative;
            white-space: pre-wrap;
            word-wrap: break-word;
            letter-spacing: 0.015em;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .letter-text .cursor-blink {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background: var(--rose);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.65s step-end infinite;
            border-radius: 1px;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
        .letter-signature {
            text-align: right;
            margin-top: 18px;
            color: var(--rose);
            font-style: italic;
            font-size: 1.2rem;
            opacity: 0;
            transition: opacity 1.8s ease;
            letter-spacing: 0.03em;
            padding-right: 4px;
        }
        .letter-signature.visible {
            opacity: 1;
        }
        .letter-signature i {
            margin-left: 6px;
            animation: heartbeat 2.2s ease-in-out infinite;
            font-size: 0.9rem;
        }

        /* Clock Section */
        .clock-section {
            text-align: center;
            margin-bottom: 24px;
            padding: 18px 12px;
            background: rgba(0, 0, 0, 0.22);
            border-radius: 20px;
            border: 1px solid rgba(245, 198, 170, 0.14);
        }
        .clock-icon-row {
            color: var(--peach);
            font-size: 1rem;
            margin-bottom: 4px;
            letter-spacing: 5px;
            opacity: 0.8;
        }
        .clock-time {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--cream);
            letter-spacing: 0.04em;
            font-family: 'Georgia', 'Courier New', monospace;
            text-shadow: 0 0 14px rgba(245, 198, 170, 0.22);
        }
        .clock-time .seconds {
            font-size: 1.2rem;
            color: var(--peach);
            margin-left: 2px;
            font-weight: normal;
        }
        .clock-date {
            font-size: 0.9rem;
            color: var(--muted);
            margin-top: 3px;
        }
        .clock-date i {
            margin-right: 5px;
            color: var(--peach);
        }
        .heartbeat-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--heart-color);
            border-radius: 50%;
            margin-left: 7px;
            animation: pulse 1.3s ease-in-out infinite;
            vertical-align: middle;
        }

        /* Calendar Section */
        .calendar-section {
            margin-bottom: 20px;
        }
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            color: var(--cream);
            font-size: 1.05rem;
            font-weight: bold;
            letter-spacing: 0.03em;
        }
        .calendar-header i {
            color: var(--rose);
            margin: 0 5px;
        }
        .calendar-header .month-year {
            flex: 1;
            text-align: center;
            font-size: 1rem;
        }
        .calendar-nav {
            background: none;
            border: 1px solid rgba(232, 160, 191, 0.3);
            color: var(--rose);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        .calendar-nav:active {
            transform: scale(0.88);
            background: rgba(232, 160, 191, 0.2);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        .day-name {
            font-size: 0.72rem;
            color: var(--muted);
            padding: 6px 0;
            letter-spacing: 0.04em;
            font-weight: bold;
        }
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.25s;
            position: relative;
            color: var(--text);
            font-family: 'Georgia', serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            min-width: 0;
        }
        .day-cell:active {
            transform: scale(0.88);
        }
        .day-cell.empty {
            cursor: default;
            pointer-events: none;
            opacity: 0.3;
        }
        .day-cell.past {
            opacity: 0.35;
            pointer-events: none;
            cursor: default;
            text-decoration: line-through;
            text-decoration-color: rgba(232, 160, 191, 0.25);
            text-decoration-thickness: 1px;
        }
        .day-cell.today {
            animation: softGlow 2.5s ease-in-out infinite;
            background: rgba(255, 123, 137, 0.3);
            color: #fff;
            font-weight: bold;
            border: 2px solid var(--today-glow);
            font-size: 0.9rem;
        }
        .day-cell.selected-date {
            animation: selectedGlow 2.2s ease-in-out infinite;
            background: rgba(201, 169, 110, 0.35);
            color: #fff;
            font-weight: bold;
            border: 2px solid var(--selected-glow);
        }
        .day-cell.future {
            cursor: pointer;
        }
        .day-cell .heart-indicator {
            position: absolute;
            top: -3px;
            right: -3px;
            font-size: 0.5rem;
            color: var(--heart-color);
            animation: pulse 1.5s ease-in-out infinite;
            pointer-events: none;
        }

        /* Date Pick Prompt */
        .date-prompt {
            text-align: center;
            margin-top: 16px;
            padding: 14px 12px;
            background: rgba(0, 0, 0, 0.22);
            border-radius: 16px;
            border: 1px dashed rgba(232, 160, 191, 0.3);
            color: var(--peach);
            font-size: 0.95rem;
            transition: all 0.5s;
            line-height: 1.5;
        }
        .date-prompt i {
            margin: 0 4px;
            animation: pulse 2s ease-in-out infinite;
        }
        .date-prompt.has-selection {
            border-style: solid;
            border-color: rgba(201, 169, 110, 0.5);
            background: rgba(201, 169, 110, 0.07);
        }

        /* Countdown Section */
        .countdown-section {
            display: none;
            text-align: center;
            margin-top: 16px;
            padding: 18px 12px;
            background: rgba(0, 0, 0, 0.28);
            border-radius: 18px;
            border: 1px solid rgba(201, 169, 110, 0.3);
            animation: fadeInUp 0.6s ease-out;
        }
        .countdown-section.visible {
            display: block;
        }
        .countdown-label {
            color: var(--peach);
            font-size: 0.85rem;
            margin-bottom: 10px;
            letter-spacing: 0.03em;
            line-height: 1.4;
        }
        .countdown-label i {
            margin: 0 3px;
            color: var(--rose);
        }
        .countdown-digits {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .countdown-block {
            background: rgba(107, 29, 58, 0.32);
            border-radius: 14px;
            padding: 12px 8px;
            min-width: 56px;
            border: 1px solid rgba(201, 169, 110, 0.22);
        }
        .countdown-number {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--cream);
            letter-spacing: 0.03em;
            animation: countdownPulse 2s ease-in-out infinite;
        }
        .countdown-unit {
            font-size: 0.68rem;
            color: var(--muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .ics-download-btn {
            display: inline-block;
            margin-top: 14px;
            padding: 11px 20px;
            background: rgba(201, 169, 110, 0.2);
            border: 1px solid rgba(201, 169, 110, 0.5);
            border-radius: 24px;
            color: var(--gold);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            letter-spacing: 0.02em;
            font-family: 'Georgia', serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ics-download-btn:active {
            transform: scale(0.94);
            background: rgba(201, 169, 110, 0.38);
            box-shadow: 0 0 20px rgba(201, 169, 110, 0.2);
        }
        .ics-download-btn i {
            margin-right: 6px;
        }
        .reset-date-btn {
            display: inline-block;
            margin-top: 10px;
            margin-left: 8px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid rgba(232, 160, 191, 0.28);
            border-radius: 24px;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.3s;
            font-family: 'Georgia', serif;
            -webkit-tap-highlight-color: transparent;
        }
        .reset-date-btn:active {
            transform: scale(0.94);
            border-color: var(--rose);
            color: var(--rose);
            background: rgba(232, 160, 191, 0.1);
        }

        /* Music Toggle */
        .music-toggle {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 10;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(22, 33, 62, 0.85);
            border: 1px solid rgba(232, 160, 191, 0.35);
            color: var(--rose);
            cursor: pointer;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .music-toggle:active {
            transform: scale(0.88);
        }
        .music-toggle.playing {
            animation: softGlow 2.5s ease-in-out infinite;
            border-color: var(--rose);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 33, 62, 0.92);
            border: 1px solid rgba(201, 169, 110, 0.5);
            color: var(--cream);
            padding: 11px 20px;
            border-radius: 24px;
            font-size: 0.85rem;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            backdrop-filter: blur(8px);
            letter-spacing: 0.02em;
            font-family: 'Georgia', serif;
            white-space: nowrap;
            max-width: 90vw;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-6px);
        }
        .toast i {
            margin-right: 5px;
            color: var(--gold);
        }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 600px) {
            body {
                padding: 10px;
                padding-top: 16px;
            }
            .main-container {
                padding: 24px 14px;
                border-radius: 22px;
            }
            .double-hearts {
                width: 44px;
                height: 44px;
            }
            .double-hearts .heart-1,
            .double-hearts .heart-2 {
                font-size: 24px;
            }
            .double-hearts .heart-2 {
                top: 8px;
                left: 12px;
            }
            .letter-text {
                font-size: 1.15rem;
                padding: 22px 14px;
                line-height: 1.75;
                border-radius: 16px;
                border-left-width: 3px;
            }
            .letter-signature {
                font-size: 1.05rem;
            }
            .clock-time {
                font-size: 1.8rem;
            }
            .clock-time .seconds {
                font-size: 1rem;
            }
            .clock-date {
                font-size: 0.82rem;
            }
            .calendar-header .month-year {
                font-size: 0.9rem;
            }
            .calendar-grid {
                gap: 3px;
            }
            .day-cell {
                font-size: 0.78rem;
            }
            .day-cell.today {
                font-size: 0.82rem;
            }
            .day-name {
                font-size: 0.66rem;
                padding: 4px 0;
            }
            .calendar-nav {
                width: 28px;
                height: 28px;
                font-size: 0.8rem;
            }
            .date-prompt {
                font-size: 0.88rem;
                padding: 12px 8px;
            }
            .countdown-number {
                font-size: 1.35rem;
            }
            .countdown-block {
                min-width: 46px;
                padding: 10px 5px;
            }
            .countdown-digits {
                gap: 8px;
            }
            .countdown-unit {
                font-size: 0.62rem;
            }
            .ics-download-btn {
                font-size: 0.82rem;
                padding: 10px 16px;
            }
            .reset-date-btn {
                font-size: 0.75rem;
                padding: 7px 13px;
            }
            .music-toggle {
                width: 40px;
                height: 40px;
                bottom: 18px;
                right: 18px;
                font-size: 1rem;
            }
            .toast {
                font-size: 0.78rem;
                padding: 9px 16px;
                bottom: 75px;
                border-radius: 20px;
            }
        }

        @media (max-width: 380px) {
            .main-container {
                padding: 18px 10px;
                border-radius: 18px;
            }
            .double-hearts {
                width: 38px;
                height: 38px;
            }
            .double-hearts .heart-1,
            .double-hearts .heart-2 {
                font-size: 20px;
            }
            .double-hearts .heart-2 {
                top: 7px;
                left: 10px;
            }
            .letter-text {
                font-size: 1.05rem;
                padding: 18px 10px;
                line-height: 1.7;
                border-radius: 14px;
            }
            .letter-signature {
                font-size: 0.95rem;
            }
            .clock-time {
                font-size: 1.5rem;
            }
            .clock-time .seconds {
                font-size: 0.85rem;
            }
            .clock-date {
                font-size: 0.75rem;
            }
            .calendar-grid {
                gap: 2px;
            }
            .day-cell {
                font-size: 0.7rem;
            }
            .day-cell.today {
                font-size: 0.74rem;
            }
            .day-name {
                font-size: 0.6rem;
            }
            .calendar-nav {
                width: 26px;
                height: 26px;
                font-size: 0.7rem;
            }
            .calendar-header .month-year {
                font-size: 0.8rem;
            }
            .date-prompt {
                font-size: 0.8rem;
                padding: 10px 6px;
            }
            .countdown-number {
                font-size: 1.2rem;
            }
            .countdown-block {
                min-width: 40px;
                padding: 8px 3px;
                border-radius: 10px;
            }
            .countdown-digits {
                gap: 6px;
            }
            .countdown-unit {
                font-size: 0.56rem;
            }
            .ics-download-btn {
                font-size: 0.75rem;
                padding: 8px 13px;
                border-radius: 20px;
            }
            .reset-date-btn {
                font-size: 0.7rem;
                padding: 6px 11px;
                border-radius: 20px;
            }
            .toast {
                font-size: 0.72rem;
                padding: 8px 13px;
                bottom: 68px;
                border-radius: 18px;
            }
            .countdown-label {
                font-size: 0.75rem;
            }
        }

        @media (max-height: 700px) {
            .main-container {
                padding: 18px 14px;
            }
            .letter-section {
                margin-bottom: 16px;
            }
            .letter-text {
                font-size: 1rem;
                padding: 16px 12px;
                max-height: 200px;
                overflow-y: auto;
            }
            .clock-section {
                margin-bottom: 14px;
                padding: 12px 8px;
            }
            .calendar-section {
                margin-bottom: 12px;
            }
            .calendar-grid {
                gap: 2px;
            }
            .day-cell {
                font-size: 0.72rem;
            }
            .date-prompt {
                margin-top: 10px;
                font-size: 0.82rem;
            }
            .countdown-section {
                margin-top: 10px;
                padding: 14px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Icons -->
    <div class="floating-icons" id="floatingIcons"></div>

    <!-- Main Container -->
    <div class="main-container">

        <!-- Apology Letter -->
        <div class="letter-section">
            <div class="letter-icon-wrapper">
                <div class="double-hearts">
                    <span class="fa-regular fa-heart heart-1"></span>
                    <span class="fa-regular fa-heart heart-2"></span>
                </div>
            </div>
            <div class="letter-text" id="letterText"></div>
            <div class="letter-signature" id="letterSignature">
                — yours, forever <i class="fa-solid fa-heart"></i>
            </div>
        </div>

        <!-- Live Clock -->
        <div class="clock-section">
            <div class="clock-icon-row">
                <i class="fa-solid fa-clock"></i> <i class="fa-solid fa-hourglass-half"></i> <i class="fa-solid fa-stopwatch"></i>
            </div>
            <div class="clock-time" id="clockTime">
                <span id="timeMain">--:--</span><span class="seconds" id="timeSeconds">:--</span>
            </div>
            <div class="clock-date" id="clockDate">
                <i class="fa-solid fa-calendar-day"></i> <span id="dateFull">---</span>
                <span class="heartbeat-dot"></span>
            </div>
        </div>

        <!-- Calendar -->
        <div class="calendar-section">
            <div class="calendar-header">
                <button class="calendar-nav" id="prevMonth" aria-label="Previous month"><i class="fa-solid fa-chevron-left"></i></button>
                <span class="month-year" id="monthYear">August 2026</span>
                <button class="calendar-nav" id="nextMonth" aria-label="Next month"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="calendar-grid" id="calendarDays"></div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <!-- Date Prompt -->
        <div class="date-prompt" id="datePrompt">
            <i class="fa-solid fa-kiss-wink-heart"></i> Pick a day for our next date, my love... <i class="fa-solid fa-rose"></i>
        </div>

        <!-- Countdown Section -->

        <!-- Countdown Section -->
<div class="countdown-section" id="countdownSection">
    <div class="countdown-label">
        <i class="fa-solid fa-heart-circle-check"></i> Counting down every second until <span id="selectedDateLabel">...</span> <i class="fa-solid fa-heart-circle-check"></i>
    </div>
    <div class="countdown-digits">
        <div class="countdown-block">
            <div class="countdown-number" id="cdDays">00</div>
            <div class="countdown-unit">Days</div>
        </div>
        <div class="countdown-block">
            <div class="countdown-number" id="cdHours">00</div>
            <div class="countdown-unit">Hours</div>
        </div>
        <div class="countdown-block">
            <div class="countdown-number" id="cdMins">00</div>
            <div class="countdown-unit">Mins</div>
        </div>
        <div class="countdown-block">
            <div class="countdown-number" id="cdSecs">00</div>
            <div class="countdown-unit">Secs</div>
        </div>
    </div>
    <div class="countdown-buttons">
        <button class="ics-download-btn" id="downloadIcsBtn">
            <i class="fa-solid fa-calendar-plus"></i> Add to Calendar
        </button>
        <button class="reset-date-btn" id="resetDateBtn">
            <i class="fa-solid fa-rotate-left"></i> Pick a different date
        </button>
        <button class="whatsapp-btn" id="whatsappBtn">
            <i class="fa-brands fa-whatsapp"></i> Tell him I picked a date
        </button>
    </div>
</div>

    <!-- Music Toggle -->
    <button class="music-toggle playing" id="musicToggle" aria-label="Toggle music">
        <i class="fa-solid fa-volume-high"></i>
    </button>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Hidden Audio -->
    <audio id="bgMusic" loop preload="auto">
        <source src="/WEMA by nknjoroge ft fedora Swahili Love Song Kenyan Soul Music.mp3" type="audio/mpeg">
    </audio>

    <script>
        (function() {
            // ============ APOLOGY MESSAGE ============
            const apologyMessage = `Hey...

        I've been sitting here for a while now, trying to figure out the right words to say. Truth is, none of them feel big enough for what I'm feeling right now.

        I messed up. I know I hurt you, and the worst part is knowing I'm the reason that beautiful smile of yours faded. You didn't deserve that. Not from me, not from anyone.

        You're my safe place — the one person who makes everything feel okay when the world gets loud. And the thought of losing even a fraction of what we have... it terrifies me more than I can put into words.

        I'm not just here to say sorry and move on like nothing happened. I want to actually make things right. I want to be better — for you, for us. Because you deserve someone who shows up. Every single day. Someone who listens, who tries harder, who doesn't take your love for granted.

        That someone should be me. And I'm going to prove it, mamaa.

        I love you. More than I've ever known how to say. More than these words can hold.

        Thank you for even reading this. For giving me a chance to try again.`;


            // ============ STATE ============
            let selectedDateStr = localStorage.getItem('apology_selectedDate') || null;
            let selectedDateObj = selectedDateStr ? new Date(selectedDateStr + 'T18:00:00') : null;
            let currentMonth = 7;
            let currentYear = 2026;
            const today = new Date(2026, 7, 8);
            let typingTimeout = null;

            // ============ DOM REFS ============
            const letterText = document.getElementById('letterText');
            const letterSignature = document.getElementById('letterSignature');
            const clockTimeEl = document.getElementById('timeMain');
            const clockSecondsEl = document.getElementById('timeSeconds');
            const clockDateEl = document.getElementById('dateFull');
            const monthYearEl = document.getElementById('monthYear');
            const calendarGrid = document.getElementById('calendarGrid');
            const calendarDaysHeader = document.getElementById('calendarDays');
            const datePrompt = document.getElementById('datePrompt');
            const countdownSection = document.getElementById('countdownSection');
            const selectedDateLabel = document.getElementById('selectedDateLabel');
            const cdDays = document.getElementById('cdDays');
            const cdHours = document.getElementById('cdHours');
            const cdMins = document.getElementById('cdMins');
            const cdSecs = document.getElementById('cdSecs');
            const downloadIcsBtn = document.getElementById('downloadIcsBtn');
            const resetDateBtn = document.getElementById('resetDateBtn');
            const musicToggle = document.getElementById('musicToggle');
            const bgMusic = document.getElementById('bgMusic');
            const toast = document.getElementById('toast');
            const floatingIconsContainer = document.getElementById('floatingIcons');

            // ============ FLOATING ICONS ============
            const floatingIconsList = [
                'fa-heart', 'fa-feather', 'fa-kiss-wink-heart', 'fa-star',
                'fa-sparkles', 'fa-dove', 'fa-heart-pulse', 'fa-rose',
                'fa-champagne-glasses', 'fa-face-kiss-wink-heart', 'fa-heart-circle-plus'
            ];

            function createFloatingIcons() {
                const count = window.innerWidth < 400 ? 14 : 24;
                let html = '';
                for (let i = 0; i < count; i++) {
                    const icon = floatingIconsList[Math.floor(Math.random() * floatingIconsList.length)];
                    const left = Math.random() * 95;
                    const animDuration = 16 + Math.random() * 26;
                    const delay = Math.random() * 24;
                    const size = 0.6 + Math.random() * 1.4;
                    const animName = Math.random() > 0.5 ? 'floatUp' : 'floatUpAlt';
                    html +=
                        `<i class="fa-solid ${icon} floating-icon" style="left:${left}%;animation-duration:${animDuration}s;animation-delay:${delay}s;font-size:${size}rem;animation-name:${animName};"></i>`;
                }
                floatingIconsContainer.innerHTML = html;
            }
            createFloatingIcons();
            window.addEventListener('resize', () => {
                createFloatingIcons();
            });

            // ============ TYPING EFFECT ============
            function typeLetter() {
                if (typingTimeout) clearTimeout(typingTimeout);
                letterText.innerHTML = '';
                letterSignature.classList.remove('visible');
                let charIndex = 0;
                const chars = apologyMessage.split('');

                function typeChar() {
                    if (charIndex < chars.length) {
                        const char = chars[charIndex];
                        if (char === '\n') {
                            letterText.innerHTML += '<br>';
                        } else if (char === ' ') {
                            letterText.innerHTML += '&nbsp;';
                        } else if (char === "'") {
                            letterText.innerHTML += '&#39;';
                        } else if (char === '"') {
                            letterText.innerHTML += '&quot;';
                        } else if (char === '<') {
                            letterText.innerHTML += '&lt;';
                        } else if (char === '>') {
                            letterText.innerHTML += '&gt;';
                        } else if (char === '&') {
                            letterText.innerHTML += '&amp;';
                        } else {
                            letterText.innerHTML += char;
                        }
                        const existingCursor = letterText.querySelector('.cursor-blink');
                        if (existingCursor) existingCursor.remove();
                        const cursor = document.createElement('span');
                        cursor.className = 'cursor-blink';
                        letterText.appendChild(cursor);
                        letterText.scrollTop = letterText.scrollHeight;
                        charIndex++;
                        const delay = 30 + Math.random() * 50;
                        typingTimeout = setTimeout(typeChar, delay);
                    } else {
                        const existingCursor = letterText.querySelector('.cursor-blink');
                        if (existingCursor) existingCursor.remove();
                        setTimeout(() => {
                            letterSignature.classList.add('visible');
                        }, 400);
                    }
                }
                setTimeout(typeChar, 500);
            }

            // ============ CLOCK ============
            function updateClock() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const mins = String(now.getMinutes()).padStart(2, '0');
                const secs = String(now.getSeconds()).padStart(2, '0');
                clockTimeEl.textContent = hours + ':' + mins;
                clockSecondsEl.textContent = ':' + secs;
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                clockDateEl.textContent = now.toLocaleDateString('en-US', options);
            }
            updateClock();
            setInterval(updateClock, 1000);

            // ============ CALENDAR LOGIC ============
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const monthNames = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];

            function renderCalendarDayHeaders() {
                let html = '';
                dayNames.forEach(d => {
                    html += `<div class="day-name">${d}</div>`;
                });
                calendarDaysHeader.innerHTML = html;
            }

            function isDatePast(year, month, day) {
                const cellDate = new Date(year, month, day);
                return cellDate < today;
            }

            function isToday(year, month, day) {
                return year === 2026 && month === 7 && day === 8;
            }

            function isSelected(year, month, day) {
                if (!selectedDateObj) return false;
                return selectedDateObj.getFullYear() === year &&
                    selectedDateObj.getMonth() === month &&
                    selectedDateObj.getDate() === day;
            }

            function renderCalendar() {
                monthYearEl.textContent = monthNames[currentMonth] + ' ' + currentYear;
                const firstDay = new Date(currentYear, currentMonth, 1).getDay();
                const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

                let html = '';
                for (let i = 0; i < firstDay; i++) {
                    html += '<div class="day-cell empty"></div>';
                }
                for (let d = 1; d <= daysInMonth; d++) {
                    const past = isDatePast(currentYear, currentMonth, d);
                    const todayFlag = isToday(currentYear, currentMonth, d);
                    const selectedFlag = isSelected(currentYear, currentMonth, d);
                    let classes = 'day-cell';
                    if (past && !todayFlag && !selectedFlag) classes += ' past';
                    if (todayFlag) classes += ' today';
                    if (selectedFlag && !todayFlag) classes += ' selected-date';
                    if (!past && !todayFlag && !selectedFlag) classes += ' future';

                    const heartIndicator = todayFlag ?
                        '<span class="heart-indicator"><i class="fa-solid fa-heart"></i></span>' : '';

                    html +=
                        `<div class="${classes}" data-day="${d}" data-month="${currentMonth}" data-year="${currentYear}">${d}${heartIndicator}</div>`;
                }
                calendarGrid.innerHTML = html;

                const allCells = calendarGrid.querySelectorAll(
                    '.day-cell.future, .day-cell.today, .day-cell.selected-date');
                allCells.forEach(cell => {
                    cell.addEventListener('click', function() {
                        const day = parseInt(this.dataset.day);
                        const month = parseInt(this.dataset.month);
                        const year = parseInt(this.dataset.year);
                        handleDateSelect(year, month, day);
                    });
                });
            }

      function handleDateSelect(year, month, day) {
    const cellDate = new Date(year, month, day);
    if (cellDate < today && !(year === 2026 && month === 7 && day === 8)) {
        showToast('Pick any future date, my love. 💕');
        return;
    }
    selectedDateObj = new Date(year, month, day, 14, 0, 0);
    selectedDateStr = selectedDateObj.toISOString().split('T')[0];
    localStorage.setItem('apology_selectedDate', selectedDateStr);
    renderCalendar();
    updateCountdownUI();
    updatePromptUI();
    
    // WhatsApp notification to you
    const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
    const formatted = selectedDateObj.toLocaleDateString('en-US', options);
    // const message = encodeURIComponent(`📅 ${formatted} at 2:00 PM\n\nGet ready! 💕`);
    window.open(`https://wa.me/254733588676?text=${message}`, '_blank');
}

            function resetSelectedDate() {
                selectedDateObj = null;
                selectedDateStr = null;
                localStorage.removeItem('apology_selectedDate');
                renderCalendar();
                updateCountdownUI();
                updatePromptUI();
                showToast('Pick a new date. I\'ll wait as long as it takes. 💕');
            }

            function updatePromptUI() {
                if (selectedDateObj) {
                    datePrompt.classList.add('has-selection');
                    const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
                    const formatted = selectedDateObj.toLocaleDateString('en-US', options);
                    datePrompt.innerHTML =
                        `<i class="fa-solid fa-heart-circle-check"></i> Our next date: <strong>${formatted}</strong> — I can't wait! <i class="fa-solid fa-heart-circle-check"></i>`;
                } else {
                    datePrompt.classList.remove('has-selection');
                    datePrompt.innerHTML =
                        '<i class="fa-solid fa-kiss-wink-heart"></i> Pick a day for our next date, my love... <i class="fa-solid fa-rose"></i>';
                }
            }

            function updateCountdownUI() {
                if (selectedDateObj) {
                    countdownSection.classList.add('visible');
                    const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
                    selectedDateLabel.textContent = selectedDateObj.toLocaleDateString('en-US', options);
                    updateCountdownDigits();
                } else {
                    countdownSection.classList.remove('visible');
                }
            }

            function updateCountdownDigits() {
                if (!selectedDateObj) return;
                const now = new Date();
                const diff = selectedDateObj.getTime() - now.getTime();
                if (diff <= 0) {
                    cdDays.textContent = '00';
                    cdHours.textContent = '00';
                    cdMins.textContent = '00';
                    cdSecs.textContent = '00';
                    return;
                }
                const totalSeconds = Math.floor(diff / 1000);
                const days = Math.floor(totalSeconds / 86400);
                const hours = Math.floor((totalSeconds % 86400) / 3600);
                const mins = Math.floor((totalSeconds % 3600) / 60);
                const secs = totalSeconds % 60;
                cdDays.textContent = String(days).padStart(2, '0');
                cdHours.textContent = String(hours).padStart(2, '0');
                cdMins.textContent = String(mins).padStart(2, '0');
                cdSecs.textContent = String(secs).padStart(2, '0');
            }

            // ============ ICS DOWNLOAD ============
            function downloadICS() {
                if (!selectedDateObj) return;
                const year = selectedDateObj.getFullYear();
                const month = String(selectedDateObj.getMonth() + 1).padStart(2, '0');
                const day = String(selectedDateObj.getDate()).padStart(2, '0');
                const dateStr = `${year}${month}${day}`;
                const now = new Date();
                const nowStr = now.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

                const icsContent = [
                    'BEGIN:VCALENDAR',
                    'VERSION:2.0',
                    'PRODID:-//Apology Website//Date//EN',
                    'CALSCALE:GREGORIAN',
                    'METHOD:PUBLISH',
                    'BEGIN:VEVENT',
                    `DTSTART:${dateStr}T140000`,
                    `DTEND:${dateStr}T170000`,
                    `DTSTAMP:${nowStr}`,
                    'UID:apology-datenight-' + dateStr + '@love',
                    'SUMMARY:Date 💕',
                    'DESCRIPTION:Our special date. Time to make things right and create beautiful memories together. 💕',
                    'LOCATION:Somewhere special',
                    'BEGIN:VALARM',
                    'TRIGGER:-PT3H',
                    'ACTION:DISPLAY',
                    'DESCRIPTION:Reminder: Date in 3 hours! 💕',
                    'END:VALARM',
                    'BEGIN:VALARM',
                    'TRIGGER:-PT30M',
                    'ACTION:DISPLAY',
                    'DESCRIPTION:Date in 30 minutes! Get ready! 💕',
                    'END:VALARM',
                    'END:VEVENT',
                    'END:VCALENDAR'
                ].join('\r\n');

                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'our-date-night.ics';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast('Calendar file downloaded! Open it to save with reminders. 💕');
            }

            // ============ TOAST ============
            let toastTimer;

            function showToast(msg) {
                toast.innerHTML = `<i class="fa-solid fa-heart"></i> ${msg}`;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3200);
            }

            // ============ MUSIC ============
            let musicPlaying = true;
            bgMusic.volume = 0.25;
            bgMusic.play().then(() => {
                musicPlaying = true;
                musicToggle.classList.add('playing');
                musicToggle.querySelector('i').className = 'fa-solid fa-volume-high';
            }).catch(() => {
                musicPlaying = false;
                musicToggle.classList.remove('playing');
                musicToggle.querySelector('i').className = 'fa-solid fa-volume-xmark';
            });

            musicToggle.addEventListener('click', () => {
                if (musicPlaying) {
                    bgMusic.pause();
                    musicPlaying = false;
                    musicToggle.classList.remove('playing');
                    musicToggle.querySelector('i').className = 'fa-solid fa-volume-xmark';
                } else {
                    bgMusic.play().then(() => {
                        musicPlaying = true;
                        musicToggle.classList.add('playing');
                        musicToggle.querySelector('i').className = 'fa-solid fa-volume-high';
                    }).catch(() => {});
                }
            });

            // ============ MONTH NAVIGATION ============
            document.getElementById('prevMonth').addEventListener('click', () => {
                if (currentMonth === 7 && currentYear === 2026) {
                    showToast('The past is behind us. Let\'s look forward. 💕');
                    return;
                }
                currentMonth--;
                if (currentMonth < 0) {
                    currentMonth = 11;
                    currentYear--;
                }
                renderCalendar();
                updatePromptUI();
            });
            document.getElementById('nextMonth').addEventListener('click', () => {
                currentMonth++;
                if (currentMonth > 11) {
                    currentMonth = 0;
                    currentYear++;
                }
                renderCalendar();
                updatePromptUI();
            });

            // ============ BUTTON EVENTS ============
            downloadIcsBtn.addEventListener('click', downloadICS);
            resetDateBtn.addEventListener('click', resetSelectedDate);

            // WhatsApp button
document.getElementById('whatsappBtn').addEventListener('click', function() {
    if (!selectedDateObj) return;
    const options = { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' };
    const formatted = selectedDateObj.toLocaleDateString('en-US', options);
    const message = encodeURIComponent(`💕 I picked \n\n📅 ${formatted} at 2:00 PM\n\nCan't wait to see you! 💕`);
    window.open('https://wa.me/254733588676?text=' + message, '_blank');
});
            // ============ INIT ============
            function init() {
                renderCalendarDayHeaders();
                renderCalendar();
                updateCountdownUI();
                updatePromptUI();
                typeLetter();
                setInterval(() => {
                    if (selectedDateObj) updateCountdownDigits();
                }, 1000);
            }
            init();

            setInterval(() => {
                renderCalendar();
                updatePromptUI();
            }, 60000);

            console.log('💕 For you. Always.');
        })();
    </script>
</body>
</html>
